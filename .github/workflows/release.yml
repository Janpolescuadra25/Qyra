name: Release Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd Frontend
          npm ci

      - name: Build and package all browser extensions
        run: |
          cd Frontend
          npm run package:all

      - name: Upload Store Release Archives
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Frontend/releases/*.zip
