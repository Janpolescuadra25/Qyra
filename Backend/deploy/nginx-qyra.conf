# Qyra Backend API Reverse Proxy (Slot #3 on vortex VPS)
# PREREQUISITE: Run Certbot to generate certificates before enabling:
# certbot --nginx -d api.qyra.io -d qyra.vortexsdo.com

server {
    listen 80;
    server_name api.qyra.io qyra.vortexsdo.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.qyra.io qyra.vortexsdo.com;

    ssl_certificate /etc/letsencrypt/live/api.qyra.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.qyra.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }
}
